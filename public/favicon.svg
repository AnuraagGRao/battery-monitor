<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="voltGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="24" y1="14" x2="40" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#voltGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Battery Terminal Tip -->
  <rect x="26" y="8" width="12" height="4" rx="2" fill="#38bdf8" fill-opacity="0.8" />

  <!-- Outer Battery Body -->
  <rect x="14" y="14" width="36" height="42" rx="8" stroke="url(#voltGrad)" stroke-width="2.5" fill="#0f172a" fill-opacity="0.85" />

  <!-- Charge Indicator Bars (Subtle Background) -->
  <rect x="18" y="44" width="28" height="8" rx="3" fill="#10b981" fill-opacity="0.2" />
  <rect x="18" y="32" width="28" height="8" rx="3" fill="#06b6d4" fill-opacity="0.2" />
  <rect x="18" y="20" width="28" height="8" rx="3" fill="#38bdf8" fill-opacity="0.2" />

  <!-- Center Lightning Bolt -->
  <path d="M35 18L23 34H33L29 48L43 30H31L35 18Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
